services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurachat-backend
    env_file:
      - .env
    environment:
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./neurachat.db:/app/neurachat.db
      - ./data:/app/data
      - neurachat-model-cache:/app/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: neurachat-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neurachat-model-cache: